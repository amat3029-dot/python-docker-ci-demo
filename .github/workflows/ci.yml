
name: Python Docker CI and Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -v

    
      - name: Build Docker image
        run: docker build --pull -t python-docker-ci-demo:${{ github.sha }} .
      
 
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: python-docker-ci-demo:${{ github.sha }}
          scan-type: image
          scan-ref: python-docker-ci-demo:${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"

      - name: Display vulnerability details and counts
        if: always()
        run: |
          python -c "import json, os, collections; p='trivy-results.json'; d=json.load(open(p)) if os.path.exists(p) else {}; v=[(r.get('Target',''),x) for r in d.get('Results',[]) for x in (r.get('Vulnerabilities') or [])]; c=collections.Counter(x.get('Severity','UNKNOWN') for _,x in v); print('CRITICAL:',c['CRITICAL'],'HIGH:',c['HIGH'],'MEDIUM:',c['MEDIUM'],'LOW:',c['LOW'],'TOTAL:',len(v)); [print(f'{x.get(\"Severity\")} | {x.get(\"VulnerabilityID\")} | {x.get(\"PkgName\")} | Installed: {x.get(\"InstalledVersion\")} | Fixed: {x.get(\"FixedVersion\") or \"No fix listed\"} | {x.get(\"Title\", \"\")}') for _,x in v]"
