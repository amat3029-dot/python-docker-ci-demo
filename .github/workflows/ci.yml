
name: Python Docker CI and Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build --pull -t python-docker-ci-demo:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: python-docker-ci-demo:${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"
          ignore-unfixed: false

      - name: Display vulnerability report and counts
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter

          path = "trivy-results.json"

          if not os.path.exists(path):
              print("ERROR: Trivy report not found. Check the scan step logs.")
              raise SystemExit(0)

          with open(path, encoding="utf-8") as f:
              report = json.load(f)

          findings = []
          for result in report.get("Results", []):
              for vuln in result.get("Vulnerabilities") or []:
                  findings.append({
                      "Severity": vuln.get("Severity", "UNKNOWN"),
                      "ID": vuln.get("VulnerabilityID", ""),
                      "Package": vuln.get("PkgName", ""),
                      "Installed": vuln.get("InstalledVersion", ""),
                     "Fixed": (vuln.get("FixedVersion") or "No fix available") if vuln.get("Severity") in ("CRITICAL", "HIGH") else "",
                      "Title": vuln.get("Title", ""),
                  })

          headers = ["Severity", "ID", "Package", "Installed", "Fixed", "Title"]
          widths = {
              h: min(max(len(h), max((len(str(row[h])) for row in findings), default=0)), 30)
              for h in headers
          }

          def fmt(row):
              return " | ".join(
                  str(row[h])[:widths[h]].ljust(widths[h]) for h in headers
              )

          print("\n=== DOCKER IMAGE VULNERABILITY REPORT ===")
          if findings:
              print(fmt({h: h for h in headers}))
              print("-+-".join("-" * widths[h] for h in headers))
              for row in findings:
                  print(fmt(row))
          else:
              print("No vulnerabilities were reported in the JSON results.")

          counts = Counter(row["Severity"] for row in findings)
          print("\n=== VULNERABILITY SUMMARY ===")
          for severity in ["CRITICAL", "HIGH", "MEDIUM", "LOW"]:
              print(f"{severity:8}: {counts[severity]}")
          print(f"{'TOTAL':8}: {len(findings)}")
          PY
